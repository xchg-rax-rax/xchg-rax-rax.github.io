lang: en
timezone: Etc/UTC

title: "the %rax exchange"
tagline: "Vulnerability research, malware reverse engineering, and low-level systems notes."
description: >-
  Vulnerability research, malware reverse engineering, and low-level systems
  notes by Lewis Patten.

url: "https://xchg-rax-rax.github.io"

social:
  name: Lewis Patten
  links:
    - https://github.com/xchg-rax-rax
    - https://www.linkedin.com/in/lewispatten/

logo: /assets/images/og-image.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
      nav: blog

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
